name: Persist FIFA16 Alphatrix OBB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download verified public OBB release
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/Davidoluwa/FaceSecure/releases/download/fifa16-alphatrix-obb-20260826'
          curl -fL --retry 5 --retry-all-errors "$BASE/main.13.com.ea.gp.fifaworld.obb" -o main.13.com.ea.gp.fifaworld.obb
          curl -fL --retry 5 --retry-all-errors "$BASE/patch.26.com.ea.gp.fifaworld.obb" -o patch.26.com.ea.gp.fifaworld.obb
          echo 'cfd554914a2a982c71a976458ada897a3ca0fcd6e42cb5e70e200e5f639366f4  main.13.com.ea.gp.fifaworld.obb' | sha256sum -c -
          echo 'bfb292954d1eef12a2443be957f12ea4de1b39ced0e58a1f3cbc511925021d02  patch.26.com.ea.gp.fifaworld.obb' | sha256sum -c -
          test "$(stat -c%s main.13.com.ea.gp.fifaworld.obb)" = '1376082760'
          test "$(stat -c%s patch.26.com.ea.gp.fifaworld.obb)" = '102869675'
          printf '%s\n' \
            'main cfd554914a2a982c71a976458ada897a3ca0fcd6e42cb5e70e200e5f639366f4 1376082760' \
            'patch bfb292954d1eef12a2443be957f12ea4de1b39ced0e58a1f3cbc511925021d02 102869675' > PROVENANCE_SHA256.txt
      - name: Tiny artifact quota probe
        uses: actions/upload-artifact@v4
        with:
          name: fifa16-quota-probe
          path: PROVENANCE_SHA256.txt
          compression-level: 0
