name: Persist FIFA16 Alphatrix OBB

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve exact MediaFire payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,requests
          page='https://www.mediafire.com/file/ycxkoqne89x35zh/FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip/file#'
          r=requests.get(page,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          text=html.unescape(r.text)
          m=re.search(r'href="(https://download[^\"]+/ycxkoqne89x35zh/[^\"]+)"', text)
          if not m:
            m=re.search(r'(https://download\d+\.mediafire\.com/[^\"\']+/ycxkoqne89x35zh/[^\"\']+\.zip)', text)
          if not m:
            raise SystemExit('Could not resolve MediaFire direct URL')
          open('direct_url.txt','w').write(m.group(1))
          PY
      - name: Download exact ZIP and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 --max-time 7200 -A 'Mozilla/5.0' "$(cat direct_url.txt)" -o FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip
          test "$(sha256sum FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip | awk '{print $1}')" = '7bd9d0bd7018dc1a1642d0f24198c9a6e7a222ff0f96d8ea1a9181411afa5c5f'
          test "$(stat -c%s FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip)" = '1408809061'
      - name: Extract and split OBBs for connector transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted chunks
          unzip -j FIFA_16_OBB_BY_ALPHATRIX_GAMING.zip 'OBB/com.ea.gp.fifaworld/main.13.com.ea.gp.fifaworld.obb' 'OBB/com.ea.gp.fifaworld/patch.26.com.ea.gp.fifaworld.obb' -d extracted
          test "$(stat -c%s extracted/main.13.com.ea.gp.fifaworld.obb)" = '1376082760'
          test "$(stat -c%s extracted/patch.26.com.ea.gp.fifaworld.obb)" = '102869675'
          split -b 90M -d -a 2 extracted/main.13.com.ea.gp.fifaworld.obb chunks/main.part.
          split -b 90M -d -a 2 extracted/patch.26.com.ea.gp.fifaworld.obb chunks/patch.part.
          sha256sum extracted/*.obb chunks/* > chunks/SHA256SUMS.txt
      - name: Tiny artifact quota probe
        uses: actions/upload-artifact@v4
        with:
          name: fifa16-quota-probe
          path: chunks/SHA256SUMS.txt
          compression-level: 0
